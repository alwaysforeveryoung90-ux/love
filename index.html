<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>я тебя люблю, даш</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      background: #0a0205;
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(200, 30, 60, 0.25) 0%, transparent 55%),
        radial-gradient(circle at 80% 90%, rgba(255, 40, 80, 0.2) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(140, 10, 40, 0.15) 0%, transparent 70%);
      font-family: 'segoe ui', 'helvetica neue', sans-serif;
      color: #ffd9e0;
      line-height: 1.7;
      padding: 3rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { background-position: 0% 0%, 100% 100%, 50% 50%; }
      50% { background-position: 30% 20%, 70% 80%, 50% 50%; }
      100% { background-position: 100% 100%, 0% 0%, 50% 50%; }
    }

    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        linear-gradient(135deg, 
          rgba(200, 20, 60, 0.18) 0%,
          rgba(255, 60, 100, 0.12) 25%,
          rgba(120, 0, 30, 0.2) 50%,
          rgba(255, 40, 80, 0.14) 75%,
          rgba(200, 20, 60, 0.18) 100%);
      background-size: 400% 400%;
      animation: auroraFlow 22s ease infinite;
      mix-blend-mode: screen;
      filter: blur(40px);
    }

    @keyframes auroraFlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .hearts-field {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -60px;
      color: #ff2e4e;
      font-size: 1.6rem;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255, 50, 90, 0.9)) drop-shadow(0 0 20px rgba(200, 20, 60, 0.6));
      animation: floatUp linear infinite;
      user-select: none;
    }

    .floating-heart::before { content: '❤'; }
    .floating-heart.h2::before { content: '♡'; }
    .floating-heart.h3::before { content: '❤'; }
    .floating-heart.h4::before { content: '💗'; }
    .floating-heart.h5::before { content: '♡'; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      10% { opacity: 0.95; }
      50% {
        transform: translateY(-55vh) translateX(35px) rotate(180deg) scale(1.15);
      }
      90% { opacity: 0.85; }
      100% {
        transform: translateY(-115vh) translateX(-25px) rotate(360deg) scale(0.8);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 5;
      max-width: 820px;
      width: 100%;
      background: rgba(30, 5, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      padding: 3rem 2.4rem;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 60, 100, 0.2),
        inset 0 0 80px rgba(200, 20, 60, 0.15);
      border: 1px solid rgba(255, 60, 100, 0.25);
      animation: containerGlow 6s ease-in-out infinite alternate;
      text-align: center;
    }

    @keyframes containerGlow {
      0% {
        box-shadow: 
          0 20px 60px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(255, 60, 100, 0.2),
          inset 0 0 80px rgba(200, 20, 60, 0.15);
      }
      100% {
        box-shadow: 
          0 20px 60px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(255, 90, 130, 0.45),
          inset 0 0 100px rgba(255, 40, 80, 0.25);
      }
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 1rem;
      background: linear-gradient(120deg, 
        #ff5c7a 0%, 
        #ff1a3c 25%, 
        #ff7a90 50%, 
        #ff0a2c 75%, 
        #ff5c7a 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
      animation: redGradientFlow 5s ease infinite, heartPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(255, 40, 80, 0.7)) drop-shadow(0 0 30px rgba(255, 20, 60, 0.45));
      padding: 0.3rem;
      user-select: none;
    }

    @keyframes redGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .subtitle {
      font-size: 1.1rem;
      text-transform: lowercase;
      color: #ffb8c5;
      margin-bottom: 2.2rem;
      font-style: italic;
      letter-spacing: 0.4px;
    }

    .love-wall {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 0.6rem;
      padding: 1.6rem 0.6rem;
      background: rgba(200, 20, 60, 0.06);
      border: 1px dashed rgba(255, 60, 100, 0.3);
      border-radius: 1.5rem;
      box-shadow: inset 0 0 40px rgba(200, 20, 60, 0.08);
    }

    .love-word {
      display: inline-block;
      font-size: 1.15rem;
      font-weight: 800;
      font-style: italic;
      text-transform: lowercase;
      letter-spacing: 0.3px;
      background-image: linear-gradient(120deg, 
        #ff5c7a 0%, 
        #ff1a3c 20%, 
        #ff8095 40%, 
        #ff0a2c 60%, 
        #ff5c7a 80%, 
        #ff1a3c 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: redGradientFlow 4s ease infinite, wordPulse 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 50, 90, 0.6)) drop-shadow(0 0 16px rgba(255, 20, 60, 0.35));
      padding: 0.15rem 0.35rem;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .love-word:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 15px rgba(255, 80, 120, 1)) drop-shadow(0 0 30px rgba(255, 40, 80, 0.7));
    }

    @keyframes wordPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* разные задержки, чтобы пульсация была волной */
    .love-word:nth-child(3n) { animation-delay: 0s, 0s; }
    .love-word:nth-child(3n + 1) { animation-delay: 0s, 0.3s; }
    .love-word:nth-child(3n + 2) { animation-delay: 0s, 0.6s; }

    .final-word {
      margin-top: 2.4rem;
      padding-top: 2rem;
      border-top: 1px dashed rgba(255, 60, 100, 0.35);
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      color: #ffb8c5;
      text-transform: lowercase;
      font-style: italic;
      text-align: center;
      font-weight: 700;
    }

    .heart {
      display: inline-block;
      animation: pulse 1.6s infinite;
      color: #ff2e4e;
      filter: drop-shadow(0 0 12px rgba(255, 50, 90, 0.95));
      margin-left: 0.4rem;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 50, 90, 0.95)); }
      50% { transform: scale(1.3); filter: drop-shadow(0 0 25px rgba(255, 80, 120, 1)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 50, 90, 0.95)); }
    }

    .music-indicator {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      border-radius: 2rem;
      background: rgba(50, 8, 20, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 60, 100, 0.4);
      box-shadow: 0 0 20px rgba(255, 40, 80, 0.35);
      color: #ff8fa0;
      font-size: 0.85rem;
      text-transform: lowercase;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    .music-indicator.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .music-indicator .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .music-indicator .bars span {
      display: block;
      width: 3px;
      background: linear-gradient(180deg, #ff8fa0, #ff2e4e);
      border-radius: 2px;
      animation: barWave 1.1s ease-in-out infinite;
      box-shadow: 0 0 6px rgba(255, 50, 90, 0.9);
    }

    .music-indicator .bars span:nth-child(1) { animation-delay: 0s; height: 6px; }
    .music-indicator .bars span:nth-child(2) { animation-delay: 0.15s; height: 12px; }
    .music-indicator .bars span:nth-child(3) { animation-delay: 0.3s; height: 8px; }
    .music-indicator .bars span:nth-child(4) { animation-delay: 0.45s; height: 14px; }

    @keyframes barWave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.2rem;
        border-radius: 2rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      .subtitle {
        font-size: 0.95rem;
      }

      .love-wall {
        gap: 0.25rem 0.4rem;
        padding: 1rem 0.4rem;
      }

      .love-word {
        font-size: 0.95rem;
        padding: 0.1rem 0.25rem;
      }

      .final-word {
        font-size: 1.1rem;
      }

      .music-indicator {
        top: 0.7rem;
        right: 0.7rem;
        padding: 0.4rem 0.7rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <div class="hearts-field" id="heartsField"></div>

  <div class="music-indicator" id="musicIndicator">
    <div class="bars">
      <span></span><span></span><span></span><span></span>
    </div>
    <span>играет</span>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>я тебя люблю, даш</h1>

    <p class="subtitle">
      1000 раз. и ещё столько же. и ещё. и ещё.
    </p>

    <div class="love-wall" id="loveWall"></div>

    <div class="final-word">
      и это только начало<span class="heart">❤</span>
    </div>
  </div>

  <script>
    (function() {
      // ===== генерация 1000 надписей "я тебя люблю, даш" =====
      const wall = document.getElementById('loveWall');
      const phrase = 'я тебя люблю, даш';

      for (let i = 0; i < 1000; i++) {
        const span = document.createElement('span');
        span.className = 'love-word';
        span.textContent = phrase;
        // добавляем запятую и пробел визуально через разделитель
        if (i < 999) {
          span.textContent = phrase + ',';
        }
        wall.appendChild(span);
      }

      // ===== плавающие сердечки =====
      const field = document.getElementById('heartsField');
      const heartCount = 40;
      const variants = ['', 'h2', 'h3', 'h4', 'h5'];

      function createHeart() {
        const heart = document.createElement('div');
        const variant = variants[Math.floor(Math.random() * variants.length)];
        heart.className = 'floating-heart' + (variant ? ' ' + variant : '');

        const left = Math.random() * 100;
        const size = 0.8 + Math.random() * 2.4;
        const duration = 10 + Math.random() * 14;
        const delay = Math.random() * 15;

        heart.style.left = left + '%';
        heart.style.fontSize = size + 'rem';
        heart.style.animationDuration = duration + 's';
        heart.style.animationDelay = delay + 's';

        field.appendChild(heart);
      }

      for (let i = 0; i < heartCount; i++) {
        createHeart();
      }

      setInterval(() => {
        if (field.children.length < heartCount + 10) {
          createHeart();
        }
        if (field.children.length > heartCount + 25) {
          field.removeChild(field.firstChild);
        }
      }, 8000);

      // ===== музыка =====
      const music = document.getElementById('bgMusic');
      const indicator = document.getElementById('musicIndicator');
      let started = false;

      music.volume = 0.5;

      const tryPlay = () => {
        if (started) return;
        const p = music.play();
        if (p !== undefined) {
          p.then(() => {
            started = true;
            indicator.classList.add('visible');
          }).catch(() => {});
        }
      };

      const events = ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'];

      const onFirstInteract = () => {
        tryPlay();
        if (started) {
          events.forEach(ev => window.removeEventListener(ev, onFirstInteract));
        }
      };

      events.forEach(ev => window.addEventListener(ev, onFirstInteract, { passive: true }));

      music.addEventListener('play', () => indicator.classList.add('visible'));
      music.addEventListener('pause', () => indicator.classList.remove('visible'));
      music.addEventListener('error', () => indicator.classList.remove('visible'));
    })();
  </script>
</body>
</html>
